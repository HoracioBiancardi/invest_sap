<!doctype html>
<html lang="pt-BR" data-theme="{{ tema }}">
<head>
{% include "_head.html" %}
<script src="/static/app.js?v={{ v }}" defer></script>
<title>{% block titulo %}Portal de Acesso{% endblock %} · DataPlataform</title>
</head>
<body class="portal"{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
<div class="aurora" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="orb orb-4"></div></div>
<main class="portal-caixa">
  <div class="portal-marca">
    <div class="portal-icone">{{ icone("lock") }}</div>
    <div><div class="portal-titulo">HOPPER</div><div class="portal-sub">{% block subtitulo %}{% endblock %}</div></div>
  </div>
  {% block corpo %}{% endblock %}
</main>
</body>
</html>
