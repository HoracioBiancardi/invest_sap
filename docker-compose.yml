# Mesma VM do input_arquivos (porta 8004) — este app usa a 8005.
services:
  invest-sap:
    build: .
    container_name: invest-sap
    env_file: .env   # credenciais do DW (ou vazias, se usar o cofre) e APP_ACCESS_KEY — ver .env.example
    ports:
      - "8005:8005"   # HTTP direto na rede interna, como o input_arquivos hoje; com o Caddy, trocar por "127.0.0.1:8005:8005"
    volumes:
      # Antes do 1º `up`: mkdir -p data && sudo chown 10001:10001 data (o container roda sem root, uid 10001)
      - ./data:/app/data   # app.db (usuários, sessões, cofre cifrado, configurações) e .access_key
    restart: unless-stopped
