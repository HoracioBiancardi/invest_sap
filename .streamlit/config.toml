# Paleta base = tema "Corporativo" do app_template (padrão do ecossistema SwordPower,
# frontend/css/theme.css). É ela que pinta o que CSS não alcança: gráficos (Vega/Altair),
# grade do st.dataframe (canvas) e widgets nativos. Os demais temas (Verde Neutro, Cyber Dark,
# Blau) são aplicados por cima via CSS em scripts/ui_theme.py; Streamlit não troca este
# arquivo em tempo de execução. A paleta Blau original (#26B4E9 / #2F343C / Roboto) vive no
# tema "Blau (marca)" de ui_theme.THEMES — ver docs/COMO_RODAR.md §9.2.
[theme]
base = "dark"
primaryColor = "#5B8DEF"
backgroundColor = "#12141A"
secondaryBackgroundColor = "#1A1D24"
textColor = "#E4E6EB"
linkColor = "#5B8DEF"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap, sans-serif"
codeFont = "Share Tech Mono:https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap, monospace"
baseRadius = "medium"
borderColor = "#2D323D"
dataframeBorderColor = "#2D323D"
dataframeHeaderBackgroundColor = "#21252E"
showWidgetBorder = true
# primary, âmbar, verde, cinza, violeta, vermelho — tokens --primary/--warn/--success/
# --text-muted/cyber-dark/--danger do template.
chartCategoricalColors = ["#5B8DEF", "#F59E0B", "#22C55E", "#9AA0AC", "#8B5CF6", "#EF4444"]

[theme.sidebar]
backgroundColor = "#1A1D24"
secondaryBackgroundColor = "#21252E"
textColor = "#E4E6EB"
borderColor = "#2D323D"

[browser]
gatherUsageStats = false

# Endurecimento padrão do ecossistema SwordPower (ver app_template/.env.example e
# ~/.claude/security-review-checklist.md): app internal-only, sem auth própria — a única
# barreira de rede é escutar só em loopback. Nunca trocar por 0.0.0.0.
[server]
address = "127.0.0.1"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 5

[client]
# Não vaza traceback/caminho/SQL na tela; o detalhe continua no log do terminal.
showErrorDetails = "type"
toolbarMode = "viewer"
